# API only (no Redis/Celery — async jobs not used yet).
# Usage: docker compose up --build
services:
  app:
    build: .
    ports:
      - "7862:7862"
    environment:
      - PORT=7862
      - SERVER_NAME=0.0.0.0
      # Optional: DATABASE_URL=postgresql://... for Postgres instead of default SQLite in the image
      # Optional: API_KEYS, VOICE_STORAGE_BACKEND, etc.
    volumes:
      - voice_storage:/app/voice_storage

volumes:
  voice_storage: {}
